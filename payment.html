<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0217">
<title>NYOTA FUNDS — Payment</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    padding:16px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    width:100%;
    padding:22px 18px 18px;
    border-radius:18px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);
}

h1{
    text-align:center;
    font-size:22px;
    margin:2px 0 8px;
}

p{
    font-size:14px;
    line-height:1.5;
    color:rgba(255,255,255,.72);
    text-align:center;
}

.amount{
    margin:18px 0;
    padding:14px 10px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    background:rgba(155,53,255,.08);
    border:1px solid rgba(155,53,255,.18);
}

label{
    display:block;
    margin:15px 0 7px;
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,.88);
}

input{
    width:100%;
    padding:14px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:rgba(169,72,255,.8);
    box-shadow:0 0 0 3px rgba(155,55,255,.12);
}

input[readonly]{
    opacity:.75;
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#9B35FF,#6C1DCE);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(137,43,226,.30);
}

button:hover{
    background:linear-gradient(135deg,#A844FF,#7625DC);
}

button:disabled{
    background:rgba(255,255,255,.25);
    cursor:not-allowed;
    box-shadow:none;
}

#stkMessage{
    min-height:42px;
    margin-top:13px;
    color:#B86CFF;
    font-size:13px;
    font-weight:600;
}

.success{
    color:#6DFFAA !important;
}

.error{
    color:#FF7D8A !important;
}

.small{
    font-size:12px !important;
    color:rgba(255,255,255,.48) !important;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Processing Fee</h1>

<p>
Welcome, <strong id="name">Applicant</strong>
</p>

<p>
Please continue with your application.
</p>

<div class="amount" id="feeAmount">
Application: Free
</div>

<label for="fullName">
Full Name
</label>

<input
    type="text"
    id="fullName"
    readonly
>

<label for="phone">
M-PESA Phone Number
</label>

<input
    type="tel"
    id="phone"
    inputmode="numeric"
    autocomplete="tel"
    placeholder="2547XXXXXXXX"
    maxlength="12"
>

<button
    id="payBtn"
    type="button"
>
Continue Application
</button>

<p
    id="stkMessage"
    role="status"
    aria-live="polite"
></p>

<p class="small">
Continue to the next application step.
</p>

</div>

</div>

<script>

"use strict";

/* =========================
   LOAD APPLICANT INFORMATION
========================= */

const applicant =
    localStorage.getItem("applicantName") ||
    "Applicant";

document.getElementById("name")
    .textContent = applicant;

document.getElementById("fullName")
    .value = applicant;


/* =========================
   ELEMENTS
========================= */

const phoneEl =
    document.getElementById("phone");

const payBtn =
    document.getElementById("payBtn");

const messageEl =
    document.getElementById("stkMessage");


/* =========================
   CONTINUE APPLICATION
========================= */

function continueApplication(){

    localStorage.setItem(
        "fullName",
        document.getElementById("fullName").value
    );

    setTimeout(function(){

        window.location.href = "delivery.html";

    }, 300);

}


/* =========================
   BUTTON
========================= */

payBtn.addEventListener(
    "click",
    continueApplication
);

</script>

</body>
</html>
