<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funding Application</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

:root{
--green:#0B7A2F;
--blue:#2563EB;
--blue-dark:#1D4ED8;
--border:#E5E7EB;
--text:#111827;
}

body{
background:linear-gradient(135deg,var(--green),var(--blue));
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.18);
}

h1{
text-align:center;
color:var(--green);
margin-bottom:10px;
}

p{
text-align:center;
color:#555;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
font-weight:bold;
color:var(--green);
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid var(--border);
border-radius:8px;
font-size:16px;
background:#fff;
color:var(--text);
}

input:focus,
select:focus{
outline:none;
border-color:var(--blue);
box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

button{
width:100%;
padding:15px;
margin-top:25px;
background:linear-gradient(135deg,var(--blue),var(--blue-dark));
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
box-shadow:0 8px 22px rgba(37,99,235,.25);
}

button:hover{
opacity:.96;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Funding Application</h1>
<p>Please complete all fields below.</p>

<form onsubmit="submitApplication(event)">

<label>Full Name</label>
<input type="text" id="applicantName" placeholder="Enter your full name" required>

<label>National ID Number</label>
<input type="number" placeholder="Enter your ID Number" required>

<label>Phone Number</label>
<input type="tel" placeholder="07XXXXXXXX" required>

<label>County</label>
<select required>
<option value="">Select County</option>
<option>Nairobi</option>
<option>Mombasa</option>
<option>Kisumu</option>
<option>Nakuru</option>
<option>Uasin Gishu</option>
<option>Kiambu</option>
<option>Other</option>
</select>

<label>Occupation</label>
<select required>
<option value="">Select Occupation</option>
<option>Student</option>
<option>Business Owner</option>
<option>Self Employed</option>
<option>Employed</option>
<option>Farmer</option>
<option>Other</option>
</select>

<button type="submit" id="continueBtn">Continue</button>

</form>

</div>
</div>

<script>
function submitApplication(event){
event.preventDefault();

const button=document.getElementById("continueBtn");
button.textContent="Processing...";
button.disabled=true;

const name=document.getElementById("applicantName").value;
localStorage.setItem("applicantName",name);

setTimeout(function(){
window.location.href="purpose.html";
},500);
}
</script>

</body>
</html>
